<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji SRS: 650 Core</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #0c0c0e;
        --panel-bg: #151518;
        --text-main: #f5f5f5;
        --text-muted: #888;
        --red-accent: #e53935;
        --red-hover: #ff6161;
        --gray-border: #333;
        --btn-again: #d32f2f;
        --btn-hard: #f57c00;
        --btn-good: #388e3c;
        --btn-easy: #1976d2;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    header {
        width: 100%;
        background-color: var(--panel-bg);
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid var(--red-accent);
    }

    h1 { color: var(--text-main); margin: 0; font-weight: 600; letter-spacing: 1px;}
    h1 span { color: var(--red-accent); }

    .container {
        width: 90%;
        max-width: 600px;
        background-color: var(--panel-bg);
        margin: 30px 0;
        padding: 35px;
        border-radius: 12px;
        border: 1px solid #222;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        display: none; 
        flex-direction: column;
    }

    .container.active { display: flex; }

    .dashboard-stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 30px;
        text-align: center;
    }
    
    .stat-box { background: #1a1a20; padding: 20px; border-radius: 8px; border: 1px solid #2a2a30; width: 40%;}
    .stat-num { font-size: 36px; font-weight: bold; color: var(--red-accent); }
    .stat-label { color: var(--text-muted); font-size: 14px; text-transform: uppercase; }

    button {
        background-color: #222;
        color: white;
        border: 1px solid var(--gray-border);
        padding: 15px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
        font-weight: 600;
        width: 100%;
        margin-bottom: 10px;
    }

    button.primary { background-color: var(--red-accent); border: none; }
    button.primary:hover { background-color: var(--red-hover); transform: translateY(-2px); }
    button:disabled { background-color: #333; color: #666; cursor: not-allowed; transform: none; border: none; }
    
    .kanji-display {
        font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
        font-weight: 400;
        font-size: 120px;
        text-align: center;
        margin: 20px 0;
        text-shadow: 0 0 20px rgba(255,255,255,0.05);
    }
    
    ruby { ruby-align: center; }
    rt { font-family: 'Segoe UI', sans-serif; font-size: 24px; color: var(--text-muted); transform: translateY(-5px); }

    .meanings-display {
        color: var(--red-accent);
        font-size: 24px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 25px;
    }

    .payload-section {
        background: #1a1a20;
        border: 1px solid #2a2a30;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .payload-title {
        color: var(--text-muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .vocab-list { margin: 0; padding-left: 20px; }
    .vocab-list li { margin-bottom: 5px; font-size: 16px; }
    .vocab-reading { color: #aaa; font-size: 14px; }
    
    .grade-buttons {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    .grade-btn {
        flex: 1;
        padding: 15px 5px;
        font-size: 14px;
        border: none;
        color: white;
    }
    
    .btn-again { background-color: var(--btn-again); }
    .btn-hard { background-color: var(--btn-hard); }
    .btn-good { background-color: var(--btn-good); }
    .btn-easy { background-color: var(--btn-easy); }

    #review-details { display: none; }
</style>
</head>
<body>

<header>
    <h1>Kanji<span>SRS</span></h1>
</header>

<div id="dashboard" class="container active">
    <div class="dashboard-stats">
        <div class="stat-box">
            <div id="due-count" class="stat-num">0</div>
            <div class="stat-label">Reviews Due</div>
        </div>
        <div class="stat-box">
            <div id="new-count" class="stat-num">0</div>
            <div class="stat-label">New Kanji</div>
        </div>
    </div>
    <button class="primary" onclick="startReview()" id="btn-review">Study Due Reviews</button>
    <button onclick="startLearn()" id="btn-learn">Learn New Kanji</button>
    <button onclick="resetData()" style="margin-top:20px; background: transparent; color: #555; border-color: #333;">Reset Progress</button>
</div>

<div id="learn-view" class="container">
    <div style="text-align:center; color:var(--text-muted); margin-bottom: 10px;" id="learn-progress">New Kanji</div>
    <div class="kanji-display">
        <ruby><span id="learn-kanji"></span><rt id="learn-furigana"></rt></ruby>
    </div>
    <div id="learn-meanings" class="meanings-display"></div>
    
    <div class="payload-section">
        <div class="payload-title">Radical Breakdown</div>
        <div id="learn-radicals"></div>
    </div>
    
    <div class="payload-section">
        <div class="payload-title">Mnemonic Story</div>
        <div id="learn-mnemonic"></div>
    </div>
    
    <div class="payload-section">
        <div class="payload-title">Target Vocabulary</div>
        <ul class="vocab-list" id="learn-vocab"></ul>
    </div>
    
    <button class="primary" onclick="finishLearnItem()" style="margin-top: 15px;">Got it (Add to SRS)</button>
</div>

<div id="review-view" class="container">
    <div style="text-align:center; color:var(--text-muted); margin-bottom: 10px;" id="review-progress">Review</div>
    <div class="kanji-display" style="margin-bottom: 40px;" id="review-kanji"></div>
    <button id="btn-reveal" class="primary" onclick="revealAnswer()">Show Answer</button>

    <div id="review-details">
        <div class="meanings-display" id="review-meanings"></div>
        <div style="text-align: center; color: var(--text-muted); font-size: 20px; margin-top: -20px; margin-bottom: 20px;" id="review-furigana"></div>
        
        <div class="payload-section">
            <div class="payload-title">Target Vocabulary Recall</div>
            <ul class="vocab-list" id="review-vocab"></ul>
        </div>

        <div style="text-align:center; margin-top: 25px; color:#aaa; font-size:14px;">How well did you recall the meaning and vocabulary?</div>
        <div class="grade-buttons">
            <button class="grade-btn btn-again" onclick="processGrade(1)">Again<br><small>(<1m)</small></button>
            <button class="grade-btn btn-hard" onclick="processGrade(2)">Hard<br><small id="int-hard"></small></button>
            <button class="grade-btn btn-good" onclick="processGrade(3)">Good<br><small id="int-good"></small></button>
            <button class="grade-btn btn-easy" onclick="processGrade(4)">Easy<br><small id="int-easy"></small></button>
        </div>
    </div>
</div>

    "夕": { radicals: "夕 (Evening)", mnemonic: "A crescent moon appearing early in the EVENING.", vocab: [{word: "夕方", reading: "ゆうがた", meaning: "Evening"}, {word: "七夕", reading: "たなばた", meaning: "Star Festival"}] },
    "春": { radicals: "日 (Sun), 三 (Three), 人 (Person)", mnemonic: "Three people bathing in the warm sun of SPRING.", vocab: [{word: "春", reading: "はる", meaning: "Spring"}, {word: "青春", reading: "せいしゅん", meaning: "Youth"}] },
    "夏": { radicals: "夂 (Winter/Walk), 目 (Eye)", mnemonic: "Walking with eyes squinting from the bright SUMMER sun.", vocab: [{word: "夏", reading: "なつ", meaning: "Summer"}, {word: "夏休み", reading: "なつやすみ", meaning: "Summer vacation"}] },
    "秋": { radicals: "禾 (Grain), 火 (Fire)", mnemonic: "Burning the harvested grain fields in AUTUMN.", vocab: [{word: "秋", reading: "あき", meaning: "Autumn"}, {word: "秋分", reading: "しゅうぶん", meaning: "Autumnal equinox"}] },
    "冬": { radicals: "夂 (Winter/Walk), 冫 (Ice)", mnemonic: "Walking on ice in the cold WINTER.", vocab: [{word: "冬", reading: "ふゆ", meaning: "Winter"}, {word: "春夏秋冬", reading: "しゅんかしゅうとう", meaning: "Four seasons"}] },
    "季": { radicals: "禾 (Grain), 子 (Child)", mnemonic: "A child holding grain represents the harvest SEASON.", vocab: [{word: "季節", reading: "きせつ", meaning: "Season"}, {word: "四季", reading: "しき", meaning: "Four seasons"}] },
    "節": { radicals: "竹 (Bamboo), 即 (Immediate)", mnemonic: "Bamboo joints represent SEASONS or NODES of time.", vocab: [{word: "季節", reading: "きせつ", meaning: "Season"}, {word: "節約", reading: "せつやく", meaning: "Saving / Economy"}] },
    "期": { radicals: "月 (Moon), 其 (That/Base)", mnemonic: "Using the moon to track a PERIOD of time.", vocab: [{word: "期間", reading: "きかん", meaning: "Period / Term"}, {word: "期待", reading: "きたい", meaning: "Expectation"}] },
    "始": { radicals: "女 (Woman), 台 (Stand)", mnemonic: "A woman standing at the starting line to BEGIN.", vocab: [{word: "始める", reading: "はじめる", meaning: "To begin (transitive)"}, {word: "開始", reading: "かいし", meaning: "Start / Commencement"}] }
};

let kanjiDB = [];
let dbMap = {};

function initDB() {
    let items = rawDataString.split("|");
    items.forEach(item => {
        let parts = item.split(":");
        if(parts.length < 3) return;
        
        let char = parts[0];
        let baseObj = {
            id: char,
            char: char,
            furigana: parts[1],
            meanings: parts[2].split(",").join(", "),
            radicals: char + " (Base)",
            mnemonic: `To remember ${char}, associate it with its core meaning: ${parts[2].split(",")[0]}.`,
            vocab: [
                { word: char + "字", reading: parts[1] + "じ", meaning: parts[2].split(",")[0] + " character" }
            ]
        };

        if(richDictionary[char]) {
            baseObj.radicals = richDictionary[char].radicals;
            baseObj.mnemonic = richDictionary[char].mnemonic;
            baseObj.vocab = richDictionary[char].vocab;
        }

        kanjiDB.push(baseObj);
        dbMap[char] = baseObj;
    });
}

// SM-2 Based SRS Algorithm
let srsState = JSON.parse(localStorage.getItem('kanji_srs_data')) || {};

function getNewKanji() { return kanjiDB.filter(k => !srsState[k.id]); }
function getDueKanji() { const now = Date.now(); return kanjiDB.filter(k => srsState[k.id] && srsState[k.id].nextReview <= now); }

function updateDashboard() {
    document.getElementById('due-count').innerText = getDueKanji().length;
    document.getElementById('new-count').innerText = getNewKanji().length;
    
    document.getElementById('btn-review').disabled = getDueKanji().length === 0;
    document.getElementById('btn-learn').disabled = getNewKanji().length === 0;
}

function calculateNextReview(grade, currentItemState) {
    let state = currentItemState || { interval: 0, repetition: 0, efactor: 2.5 };
    
    if (grade >= 3) {
        if (state.repetition === 0) state.interval = 1;
        else if (state.repetition === 1) state.interval = 6;
        else state.interval = Math.round(state.interval * state.efactor);
        state.repetition += 1;
    } else {
        state.repetition = 0;
        state.interval = 1; 
    }

    let sm2Grade = grade === 1 ? 0 : grade === 2 ? 3 : grade === 3 ? 4 : 5;
    state.efactor = state.efactor + (0.1 - (5 - sm2Grade) * (0.08 + (5 - sm2Grade) * 0.02));
    if (state.efactor < 1.3) state.efactor = 1.3;

    const msPerDay = 24 * 60 * 60 * 1000;
    state.nextReview = Date.now() + (state.interval * msPerDay);
    
    return state;
}

function formatInterval(days) {
    if(days === 0) return "< 1m";
    if(days === 1) return "1d";
    if(days < 30) return days + "d";
    return Math.round(days/30) + "m";
}

let currentQueue = [];
let currentItem = null;

function showView(viewId) {
    document.querySelectorAll('.container').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
}

function startLearn() {
    currentQueue = getNewKanji().slice(0, 5); 
    if(currentQueue.length === 0) return;
    renderLearnItem();
    showView('learn-view');
}

function renderLearnItem() {
    currentItem = currentQueue[0];
    document.getElementById('learn-kanji').innerText = currentItem.char;
    document.getElementById('learn-furigana').innerText = currentItem.furigana;
    document.getElementById('learn-meanings').innerText = currentItem.meanings;
    document.getElementById('learn-radicals').innerText = currentItem.radicals;
    document.getElementById('learn-mnemonic').innerText = currentItem.mnemonic;
    
    let vocabHtml = "";
    currentItem.vocab.forEach(v => {
        vocabHtml += `<li><strong>${v.word}</strong> <span class="vocab-reading">(${v.reading})</span> - ${v.meaning}</li>`;
    });
    document.getElementById('learn-vocab').innerHTML = vocabHtml;
}

function finishLearnItem() {
    srsState[currentItem.id] = { interval: 0, repetition: 0, efactor: 2.5, nextReview: Date.now() };
    saveData();
    currentQueue.shift();
    if(currentQueue.length > 0) renderLearnItem();
    else { updateDashboard(); showView('dashboard'); }
}

function startReview() {
    currentQueue = getDueKanji();
    if(currentQueue.length === 0) return;
    currentQueue.sort(() => Math.random() - 0.5);
    renderReviewItem();
    showView('review-view');
}

function renderReviewItem() {
    currentItem = currentQueue[0];
    document.getElementById('review-progress').innerText = `Due: ${currentQueue.length}`;
    document.getElementById('review-kanji').innerText = currentItem.char;
    document.getElementById('btn-reveal').style.display = 'block';
    document.getElementById('review-details').style.display = 'none';
}

function revealAnswer() {
    document.getElementById('btn-reveal').style.display = 'none';
    document.getElementById('review-details').style.display = 'block';
    
    document.getElementById('review-meanings').innerText = currentItem.meanings;
    document.getElementById('review-furigana').innerText = currentItem.furigana;
    
    let vocabHtml = "";
    currentItem.vocab.forEach(v => {
        vocabHtml += `<li><strong>${v.word}</strong> <span class="vocab-reading">(${v.reading})</span> - ${v.meaning}</li>`;
    });
    document.getElementById('review-vocab').innerHTML = vocabHtml;

    let currentState = srsState[currentItem.id];
    document.getElementById('int-hard').innerText = formatInterval(calculateNextReview(2, {...currentState}).interval);
    document.getElementById('int-good').innerText = formatInterval(calculateNextReview(3, {...currentState}).interval);
    document.getElementById('int-easy').innerText = formatInterval(calculateNextReview(4, {...currentState}).interval);
}

function processGrade(grade) {
    let state = srsState[currentItem.id];
    srsState[currentItem.id] = calculateNextReview(grade, state);
    saveData();
    
    currentQueue.shift();
    if(currentQueue.length > 0) renderReviewItem();
    else { updateDashboard(); showView('dashboard'); }
}

function saveData() { localStorage.setItem('kanji_srs_data', JSON.stringify(srsState)); }

function resetData() {
    if(confirm("Delete all SRS progress? This cannot be undone.")) {
        localStorage.removeItem('kanji_srs_data');
        srsState = {};
        updateDashboard();
    }
}

window.onload = () => {
    initDB();
    updateDashboard();
};
</script>
