<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Mastery: Typed Input Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #0c0c0e;
        --panel-bg: #151518;
        --text-main: #f5f5f5;
        --text-muted: #888;
        --red-accent: #e53935;
        --red-hover: #ff6161;
        --gray-border: #333;
        --correct-color: #4caf50;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    header {
        width: 100%;
        background-color: var(--panel-bg);
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid var(--red-accent);
        box-sizing: border-box;
    }

    h1 { color: var(--text-main); margin: 0 0 15px 0; font-weight: 600; letter-spacing: 1px;}
    h1 span { color: var(--red-accent); }

    .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    select, button {
        background-color: #222;
        color: white;
        border: 1px solid var(--gray-border);
        padding: 10px 15px;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
    }

    button {
        background-color: var(--red-accent);
        font-weight: 600;
        border: none;
    }

    button:hover { background-color: var(--red-hover); transform: translateY(-1px); }
    button:disabled { background-color: #444; cursor: not-allowed; transform: none; color: #888;}

    .mode-switch { margin-top: 20px; display: flex; gap: 10px; justify-content: center;}
    .mode-btn { background-color: #2a2a30; border: 1px solid #3a3a40; color: #aaa; }
    .mode-btn.active { background-color: var(--red-accent); color: white; border-color: var(--red-accent); }

    .container {
        width: 90%;
        max-width: 600px;
        background-color: var(--panel-bg);
        margin-top: 30px;
        margin-bottom: 50px;
        padding: 35px;
        border-radius: 12px;
        border: 1px solid #222;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        display: none; 
        flex-direction: column;
        align-items: center;
    }

    .container.active { display: flex; }

    .kanji-display {
        font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
        font-weight: 400;
        font-size: 140px;
        margin: 10px 0 30px 0;
        text-shadow: 0 0 20px rgba(255,255,255,0.05);
        line-height: 1;
    }

    .progress { color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px;}
    
    .instruction-text {
        text-align: center;
        color: #aaa;
        font-size: 16px;
        margin-bottom: 20px;
    }

    /* Typed Input Styles */
    .input-group {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        margin-bottom: 25px;
    }

    .input-field {
        background: #1a1a20;
        border: 1px solid #2a2a30;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        font-size: 18px;
        width: 100%;
        box-sizing: border-box;
        transition: all 0.2s;
    }

    .input-field:focus {
        border-color: var(--red-accent);
        outline: none;
    }

    .input-field:disabled {
        background: #111;
        color: #777;
    }

    .input-field.correct {
        border-color: var(--correct-color);
        background: rgba(76, 175, 80, 0.1);
    }

    .input-field.incorrect {
        border-color: var(--red-accent);
        background: rgba(229, 57, 53, 0.1);
    }

    .action-btn {
        width: 100%;
        padding: 16px;
        font-size: 18px;
        margin-bottom: 10px;
    }

    .feedback-area {
        min-height: 60px;
        font-size: 16px;
        margin-bottom: 20px;
        text-align: center;
        line-height: 1.5;
        width: 100%;
    }
    
    .next-btn {
        width: 100%;
        padding: 16px;
        font-size: 18px;
        display: none;
        background-color: #2a2a30;
        border: 1px solid #3a3a40;
    }

    .next-btn:hover {
        background-color: #3a3a40;
    }
    
    .correct-text { color: var(--correct-color); font-weight: bold; }
    .incorrect-text { color: var(--red-accent); font-weight: bold; }
    .correction-text { color: #aaa; font-size: 14px; display: block; margin-top: 5px; }
</style>
</head>
<body>

<header>
    <h1>JLPT<span>Kanji</span> Mastery</h1>
    <div class="controls">
        <select id="categorySelect" onchange="loadCategory(this.value)">
            <option value="1">1. Numbers, Time & Days</option>
            <option value="2">2. Nature, Weather & Geography</option>
            <option value="3">3. People, Family & Body Parts</option>
            <option value="4">4. Animals, Colors & Qualities</option>
            <option value="5">5. Physical Actions & Movement</option>
            <option value="6">6. Mental Actions & Transactions</option>
            <option value="7">7. Places, Buildings, City</option>
            <option value="8">8. Home, Daily Life & Food</option>
            <option value="9">9. Society, Gov, Law & Work</option>
            <option value="10">10. Abstract Concepts & Degrees</option>
            <option value="11">11. Perception, Emotion, Status</option>
            <option value="12">12. Measurement, Systems & Infra</option>
            <option value="13">13. Core Terminology & Media</option>
        </select>
        <button onclick="startTestMode()">Start 20-Kanji Random Test</button>
    </div>
    <div class="mode-switch">
        <button id="btnStudy" class="mode-btn active" onclick="loadCategory(document.getElementById('categorySelect').value)">Category Practice</button>
        <button id="btnTest" class="mode-btn" onclick="startTestMode()">Random Test</button>
    </div>
</header>

<div id="studyMode" class="container active">
    <div id="studyProgress" class="progress">Kanji 1 / 50</div>
    <div class="kanji-display" id="studyKanji">一</div>
    <p class="instruction-text">Type the Hiragana reading and English meaning:</p>
    
    <div class="input-group">
        <input type="text" id="studyFuriInput" class="input-field" placeholder="Reading" autocomplete="off">
        <input type="text" id="studyMeanInput" class="input-field" placeholder="Meaning" autocomplete="off">
    </div>
    
    <button id="studyCheckBtn" class="action-btn" onclick="checkAnswer('study')">Check Answer</button>
    <div id="studyFeedback" class="feedback-area"></div>
    <button id="studyNextBtn" class="next-btn" onclick="nextStudyQuestion()">Next Question ➔</button>
</div>

<div id="testMode" class="container">
    <h2 style="color:var(--red-accent); margin-bottom: 10px; font-weight: 600;">20-Question JLPT Exam</h2>
    <div id="testProgress" class="progress">Question 1 / 20</div>
    <div class="kanji-display" id="testKanji">一</div>
    <p class="instruction-text">Type the Hiragana reading and English meaning:</p>
    
    <div class="input-group">
        <input type="text" id="testFuriInput" class="input-field" placeholder="Reading" autocomplete="off">
        <input type="text" id="testMeanInput" class="input-field" placeholder="Meaning" autocomplete="off">
    </div>
    
    <button id="testCheckBtn" class="action-btn" onclick="checkAnswer('test')">Check Answer</button>
    <div id="testFeedback" class="feedback-area"></div>
    <button id="testNextBtn" class="next-btn" onclick="nextTestQuestion()">Next Question ➔</button>
</div>

let kanjiDB = {};
let allKanjiFlat = [];
let currentCategory = 1;
let currentList = [];
let currentIndex = 0;
let answered = false;

// Test Mode State
let testQuestions = [];
let testScore = 0;
let isTestMode = false;

function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function initDB() {
    for (let cat = 1; cat <= 13; cat++) {
        kanjiDB[cat] = [];
        let pairs = rawData[cat].split("|");
        pairs.forEach(p => {
            if (!p) return; 
            let parts = p.split(":");
            let char = parts[0];
            let furigana = parts[1];
            let meanings = parts[2];
            let obj = { char, furigana, meanings, cat };
            kanjiDB[cat].push(obj);
            allKanjiFlat.push(obj);
        });
    }
}

function switchModeVisuals(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('studyMode').classList.remove('active');
    document.getElementById('testMode').classList.remove('active');
    
    isTestMode = (mode === 'test');

    if(mode === 'study') {
        document.getElementById('btnStudy').classList.add('active');
        document.getElementById('studyMode').classList.add('active');
    } else if (mode === 'test') {
        document.getElementById('btnTest').classList.add('active');
        document.getElementById('testMode').classList.add('active');
    }
}

function loadCategory(catId) {
    currentCategory = parseInt(catId);
    currentList = kanjiDB[currentCategory];
    currentIndex = 0;
    switchModeVisuals('study');
    renderStudy();
}

function renderStudy() {
    if(currentIndex >= currentList.length) currentIndex = 0;
    answered = false;
    let item = currentList[currentIndex];
    if (!item) return;

    document.getElementById("studyKanji").innerText = item.char;
    document.getElementById("studyProgress").innerText = `Kanji ${currentIndex + 1} / ${currentList.length}`;
    
    resetInputs('study');
}

function nextStudyQuestion() {
    currentIndex++;
    renderStudy();
}

function startTestMode() {
    let shuffled = shuffleArray([...allKanjiFlat]);
    testQuestions = shuffled.slice(0, 20);
    currentIndex = 0;
    testScore = 0;
    
    switchModeVisuals('test');
    renderTest();
}

function renderTest() {
    if(currentIndex >= 20) {
        finishTest();
        return;
    }
    
    answered = false;
    let item = testQuestions[currentIndex];
    if (!item) return;
    
    document.getElementById("testKanji").innerText = item.char;
    document.getElementById("testProgress").innerText = `Question ${currentIndex + 1} / 20`;
    
    resetInputs('test');
}

function nextTestQuestion() {
    currentIndex++;
    renderTest();
}

function finishTest() {
    document.getElementById("testKanji").innerText = "完了"; 
    
    let percentage = (testScore / 20) * 100;
    document.getElementById("testProgress").innerText = `Final Score: ${testScore} / 20 (${percentage}%)`;
    
    let evaluation = percentage >= 90 ? "Excellent work! Ready for the real exam." 
                   : percentage >= 70 ? "Good job! Keep reviewing." 
                   : "Needs more practice.";
                   
    document.getElementById("testFeedback").innerHTML = `<h3 style="color:var(--text-main);">${evaluation}</h3>`;
    
    document.getElementById("testFuriInput").style.display = "none";
    document.getElementById("testMeanInput").style.display = "none";
    document.getElementById("testCheckBtn").style.display = "none";
    
    let nextBtn = document.getElementById("testNextBtn");
    nextBtn.innerText = "Restart Test";
    nextBtn.style.display = "block";
    nextBtn.onclick = () => {
        document.getElementById("testFuriInput").style.display = "block";
        document.getElementById("testMeanInput").style.display = "block";
        document.getElementById("testCheckBtn").style.display = "block";
        startTestMode();
    };
}

function resetInputs(prefix) {
    let furiInput = document.getElementById(`${prefix}FuriInput`);
    let meanInput = document.getElementById(`${prefix}MeanInput`);
    let checkBtn = document.getElementById(`${prefix}CheckBtn`);
    let nextBtn = document.getElementById(`${prefix}NextBtn`);
    let feedback = document.getElementById(`${prefix}Feedback`);

    furiInput.value = "";
    meanInput.value = "";
    furiInput.disabled = false;
    meanInput.disabled = false;
    furiInput.className = "input-field";
    meanInput.className = "input-field";
    
    feedback.innerHTML = "";
    checkBtn.style.display = "block";
    nextBtn.style.display = "none";
    
    furiInput.focus();
}

function checkAnswer(prefix) {
    if (answered) return; 
    answered = true;
    
    let currentItem = isTestMode ? testQuestions[currentIndex] : currentList[currentIndex];
    
    let furiInput = document.getElementById(`${prefix}FuriInput`);
    let meanInput = document.getElementById(`${prefix}MeanInput`);
    
    let userFuri = furiInput.value.trim();
    let userMean = meanInput.value.trim().toLowerCase();
    
    // Parse accepted meanings (split by comma, clean whitespace, convert to lowercase)
    let acceptedMeanings = currentItem.meanings.split(',').map(m => m.trim().toLowerCase());
    
    let isFuriCorrect = (userFuri === currentItem.furigana);
    let isMeanCorrect = acceptedMeanings.includes(userMean);
    
    // UI Updates
    furiInput.disabled = true;
    meanInput.disabled = true;
    
    if (isFuriCorrect) furiInput.classList.add("correct");
    else furiInput.classList.add("incorrect");
    
    if (isMeanCorrect) meanInput.classList.add("correct");
    else meanInput.classList.add("incorrect");
    
    // Feedback Generation
    let feedbackHTML = "";
    if (isFuriCorrect && isMeanCorrect) {
        feedbackHTML = `<span class="correct-text">Perfect! (正解)</span>`;
        if (isTestMode) testScore++;
    } else {
        feedbackHTML = `<span class="incorrect-text">Incorrect. (不正解)</span>`;
        if (!isFuriCorrect) {
            feedbackHTML += `<span class="correction-text">Reading: ${currentItem.furigana}</span>`;
        }
        if (!isMeanCorrect) {
            feedbackHTML += `<span class="correction-text">Meaning: ${currentItem.meanings}</span>`;
        }
    }
    
    document.getElementById(`${prefix}Feedback`).innerHTML = feedbackHTML;
    document.getElementById(`${prefix}CheckBtn`).style.display = "none";
    
    let nextBtn = document.getElementById(`${prefix}NextBtn`);
    nextBtn.innerText = "Next Question ➔";
    nextBtn.onclick = isTestMode ? nextTestQuestion : nextStudyQuestion;
    nextBtn.style.display = "block";
}

// Add enter key event listeners
function attachEnterKey(prefix) {
    document.getElementById(`${prefix}FuriInput`).addEventListener("keypress", function(e) {
        if (e.key === "Enter") document.getElementById(`${prefix}MeanInput`).focus();
    });
    document.getElementById(`${prefix}MeanInput`).addEventListener("keypress", function(e) {
        if (e.key === "Enter") checkAnswer(prefix);
    });
}

// Initialize application
initDB();
attachEnterKey('study');
attachEnterKey('test');
loadCategory("1");
</script>
